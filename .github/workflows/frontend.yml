name: Frontend CI

on:
  push:
    branches:
      - dev
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    branches:
      - dev
    paths:
      - frontend/**
      - .github/workflows/frontend.yml

jobs:
  web_build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
